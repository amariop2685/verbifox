<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VerbiFox · Fracciones y decimales</title>
<style>
  :root{ --azul:#3b82f6; --naranja:#f97316; --rojo:#e11d48; --verde:#2bb673; --morado:#7c3aed; --fondo:#0f1b34; }
  *{ box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:radial-gradient(circle at 30% 20%, #16244a, var(--fondo)); min-height:100vh; color:#fff; overflow-x:hidden; }
  .top{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 92px 8px 14px; flex-wrap:wrap; }
  .tabs{ display:flex; gap:6px; background:rgba(255,255,255,.12); border-radius:12px; padding:4px; }
  .tab{ border:0; background:transparent; color:#cdd7e4; font-weight:800; padding:8px 12px; border-radius:9px; cursor:pointer; font-size:.9rem; }
  .tab.on{ background:#fff; color:#26303b; }
  .volver{ position:fixed; right:10px; top:12px; z-index:9; background:rgba(255,255,255,.14); color:#fff; border:1px solid rgba(255,255,255,.4); border-radius:10px; padding:7px 12px; font-weight:700; text-decoration:none; font-size:.85rem; }
  .consigna{ width:max-content; max-width:94vw; margin:2px auto 10px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.35); border-radius:12px; padding:8px 16px; font-weight:800; text-align:center; }
  .consigna b{ color:#ffd76a; font-size:1.3rem; }

  /* barra de igualdad grande */
  .igual{ display:flex; align-items:center; justify-content:center; gap:12px; font-weight:900; font-size:clamp(1.4rem,7vw,2rem); margin:6px auto 12px; }
  .igual .frac{ display:inline-flex; flex-direction:column; align-items:center; line-height:1; }
  .igual .frac .b{ border-top:3px solid #fff; padding-top:2px; }
  .igual .dec{ color:#8fd694; }

  #grid{ margin:0 auto 96px; width:min(92vw,420px); }
  #pinta{ max-height:calc(100vh - 150px); overflow:auto; }
  .cel{ aspect-ratio:1; background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.25); border-radius:6px; cursor:pointer; transition:background .1s, transform .08s; }
  .cel.on{ background:linear-gradient(145deg,#57cf95,var(--verde)); border-color:#1f8f5c; }
  .cel:active{ transform:scale(.92); }
  .cel.diez{ border-radius:8px; }

  .abajo{ position:fixed; left:0; right:0; bottom:0; display:flex; gap:10px; justify-content:center; padding:12px; flex-wrap:wrap; }
  .btn{ border:0; border-radius:14px; padding:13px 20px; font-weight:800; font-size:1rem; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.25); }
  .btn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.25); }
  .b-verde{ background:var(--verde); color:#fff; } .b-gris{ background:#dbe3ec; color:#26303b; } .b-azulb{ background:#3a7bd5; color:#fff; }
  #msj{ position:fixed; left:50%; top:120px; transform:translateX(-50%); background:#fff; color:#26303b; border-radius:14px; padding:12px 18px; font-weight:800; box-shadow:0 8px 24px rgba(0,0,0,.4); z-index:30; display:none; text-align:center; max-width:88vw; }

  /* modo emparejar */
  #par{ display:none; max-width:520px; margin:0 auto; padding:0 12px; }
  .parrow{ display:flex; gap:10px; align-items:center; justify-content:center; margin:8px 0; }
  .ficha{ flex:1; background:#fff; color:#26303b; border-radius:14px; padding:14px; text-align:center; font-weight:900; font-size:1.25rem; cursor:pointer; border:3px solid transparent; box-shadow:0 4px 10px rgba(0,0,0,.3); }
  .ficha.sel{ border-color:var(--naranja); }
  .ficha.ok{ background:#d7f5e6; border-color:var(--verde); cursor:default; }
  .ficha .frac{ display:inline-flex; flex-direction:column; line-height:1; }
  .ficha .frac .b{ border-top:2px solid #26303b; }
</style>
</head>
<body>
  <div class="top">
    <div class="tabs">
      <button class="tab on" id="tPinta" onclick="setModo('pinta')">🎨 Pinta</button>
      <button class="tab" id="tPar" onclick="setModo('par')">🔗 Empareja</button>
      <button class="tab" id="tDiv" onclick="setModo('div')">➗ Divide</button>
    </div>
    <div style="font-weight:900" id="score">⭐ 0</div>
  </div>
  <a class="volver" href="mate.html">✕ Salir</a>
  <div class="consigna" id="consigna"></div>

  <div id="pinta">
    <div class="igual" id="igual"></div>
    <div id="grid"></div>
  </div>
  <div id="par"></div>

  <!-- MODO DIVIDE: repartir y descubrir el decimal -->
  <div id="dividir" style="display:none;max-width:560px;margin:0 auto;padding:0 12px 120px">
    <div class="igual" id="divEq"></div>
    <div id="pool" style="background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.3);border-radius:14px;padding:10px;text-align:center;min-height:56px">
      <div style="font-size:.8rem;color:#9fb6d8;font-weight:800;margin-bottom:6px">PARA REPARTIR</div>
      <div id="poolFichas" style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center"></div>
    </div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0">
      <button class="btn b-verde" id="btnRep" onclick="repartirRonda()">🖐️ Repartir 1 a cada grupo</button>
      <button class="btn b-azulb" id="btnCorta" onclick="cortarDecimos()" style="display:none">✂️ Cortar el resto en décimos</button>
    </div>
    <div id="grupos" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"></div>
    <div id="divResp" style="display:none;text-align:center;margin-top:12px">
      <div style="font-weight:800;margin-bottom:6px">¿Cuánto le tocó a cada grupo? ✍️</div>
      <input id="divIn" inputmode="decimal" placeholder="ej: 5,4" style="width:120px;padding:12px;text-align:center;font-size:1.2rem;font-weight:800;border-radius:12px;border:2px solid #cbd5e1;background:#eef2f7;color:#26303b">
      <button class="btn b-verde" onclick="comprobarDiv()" style="margin-left:6px">✔</button>
    </div>
  </div>

  <div id="msj"></div>
  <div class="abajo" id="abajoPinta">
    <button class="btn b-azulb" onclick="limpiar()">🧽 Borrar</button>
    <button class="btn b-verde" onclick="comprobar()">✔ Listo</button>
    <button class="btn b-gris" onclick="nuevo()">🎲 Otro</button>
  </div>

<script src="supabase.js"></script>
<script src="cloud.js"></script>
<script src="caballero.js"></script>
<script>
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
function beep(f,d){ try{ const c=beep.ctx=beep.ctx||new (window.AudioContext||window.webkitAudioContext)(); const o=c.createOscillator(), g=c.createGain(); o.frequency.value=f; o.type='sine'; g.gain.setValueAtTime(.18,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+d);}catch(e){} }
function chime(){ [523,659,784].forEach((f,i)=>setTimeout(()=>beep(f,.3),i*90)); }
function msj(t,l){ const m=$('msj'); m.innerHTML=t; m.style.display='block'; clearTimeout(m._t); m._t=setTimeout(()=>m.style.display='none', l?3400:2000); }
function premio(){ try{ if(window.Caballero&&Caballero.premiar) Caballero.premiar(1); }catch(e){} try{ const k='mate_juego_fracciones-decimales'; localStorage.setItem(k,String((parseInt(localStorage.getItem(k)||'0',10)||0)+1)); }catch(e){} }

let modo='pinta', score=0;
function setModo(m){ modo=m;
  $('tPinta').classList.toggle('on',m==='pinta'); $('tPar').classList.toggle('on',m==='par'); $('tDiv').classList.toggle('on',m==='div');
  $('pinta').style.display=m==='pinta'?'block':'none';
  $('par').style.display=m==='par'?'block':'none';
  $('dividir').style.display=m==='div'?'block':'none';
  $('abajoPinta').style.display=m==='pinta'?'flex':'none';
  nuevo();
}
function nuevo(){ $('score').textContent='⭐ '+score; modo==='pinta'?nuevoPinta():(modo==='par'?nuevoPar():nuevoDiv()); }

// ---------- MODO DIVIDE: repartir → sobra → cortar en décimos → decimal ----------
// El niño DESCUBRE de dónde sale el decimal: 27 ÷ 5 → 5 enteros y sobran 2 → 20 décimos → 4 décimos c/u → 5,4
let dN=27, dD=5, dPool=0, dPoolDec=0, dEnt=0, dDec=0, dFase='enteros';
function nuevoDiv(){
  const casos=[[27,5],[11,2],[7,2],[12,5],[9,2],[13,5],[22,4],[11,5],[14,4],[17,2],[23,5],[13,2]];
  const c=casos[rnd(casos.length)]; dN=c[0]; dD=c[1];
  dPool=dN; dPoolDec=0; dEnt=0; dDec=0; dFase='enteros';
  $('consigna').innerHTML=`Reparte <b>${dN}</b> entre <b>${dD}</b> grupos y descubre el decimal`;
  $('divResp').style.display='none'; $('divIn').value='';
  renderDiv();
}
function renderDiv(){
  // ecuación en vivo
  const dec=dDec>0?(''+dEnt+','+dDec):(''+dEnt);
  $('divEq').innerHTML=`<span>${dN} ÷ ${dD}</span> <span>=</span> <span class="dec">${(dEnt||dDec)?dec:'¿?'}</span>`;
  // pool
  const pf=$('poolFichas');
  let h='';
  for(let i=0;i<dPool;i++) h+=`<span style="width:26px;height:26px;border-radius:7px;background:linear-gradient(145deg,#6ba3ff,#2f6fdb);display:inline-block"></span>`;
  for(let i=0;i<dPoolDec;i++) h+=`<span style="width:10px;height:26px;border-radius:4px;background:linear-gradient(145deg,#ffab6b,#f97316);display:inline-block"></span>`;
  pf.innerHTML=h || '<span style="color:#8fd694;font-weight:800">¡Nada! Repartiste todo 🎉</span>';
  // grupos
  $('grupos').innerHTML=Array.from({length:dD},(_,g)=>{
    let inner='';
    for(let i=0;i<dEnt;i++) inner+=`<span style="width:20px;height:20px;border-radius:5px;background:linear-gradient(145deg,#6ba3ff,#2f6fdb);display:inline-block"></span>`;
    for(let i=0;i<dDec;i++) inner+=`<span style="width:8px;height:20px;border-radius:3px;background:linear-gradient(145deg,#ffab6b,#f97316);display:inline-block"></span>`;
    const eti=(dEnt||dDec)?`<div style="font-size:.75rem;font-weight:800;color:#cdd7e4;margin-top:4px">${dEnt} entero${dEnt===1?'':'s'}${dDec?(' + '+dDec+' décimo'+(dDec===1?'':'s')):''}</div>`:'';
    return `<div style="flex:1;min-width:86px;max-width:120px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.25);border-radius:12px;padding:8px;text-align:center">
      <div style="font-size:.75rem;color:#9fb6d8;font-weight:800">GRUPO ${g+1}</div>
      <div style="display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:24px;margin-top:4px">${inner}</div>${eti}</div>`;
  }).join('');
  // botones según fase
  const puedeEnteros = dFase==='enteros' && dPool>=dD;
  const puedeDecimos = dFase==='decimos' && dPoolDec>=dD;
  $('btnRep').style.display=(puedeEnteros||puedeDecimos)?'':'none';
  $('btnRep').textContent = dFase==='enteros' ? '🖐️ Repartir 1 a cada grupo' : '🖐️ Repartir 1 décimo a cada grupo';
  $('btnCorta').style.display=(dFase==='enteros' && dPool>0 && dPool<dD)?'':'none';
  // ¿terminó?
  if(dFase==='decimos' && dPoolDec===0 && dPool===0){ $('divResp').style.display='block'; setTimeout(()=>{ const i=$('divIn'); if(i) i.focus(); },200); }
  if(dFase==='enteros' && dPool===0){ $('divResp').style.display='block'; }  // división exacta
}
function repartirRonda(){
  if(dFase==='enteros' && dPool>=dD){ dPool-=dD; dEnt++; beep(600,.1); }
  else if(dFase==='decimos' && dPoolDec>=dD){ dPoolDec-=dD; dDec++; beep(700,.1); }
  renderDiv();
}
function cortarDecimos(){
  // cada unidad que sobra se corta en 10 décimos
  dPoolDec += dPool*10; dPool=0; dFase='decimos';
  beep(400,.15); setTimeout(()=>beep(500,.15),120);
  msj('✂️ ¡Cada uno que sobraba se cortó en 10 décimos! Ahora sigue repartiendo.', true);
  renderDiv();
}
function comprobarDiv(){
  const v=($('divIn').value||'').trim().replace('.',',');
  const dec=dDec>0?(''+dEnt+','+dDec):(''+dEnt);
  if(v===dec){
    chime(); premio(); score++; $('score').textContent='⭐ '+score;
    $('consigna').innerHTML=`🎉 ¡Correcto! <b>${dN} ÷ ${dD} = ${dec}</b>. El decimal salió al repartir lo que sobraba. ¡${dN}/${dD} también es ${dec}!`;
    setTimeout(nuevo, 3200);
  } else { beep(180,.25); msj('Mira los grupos: cuenta los enteros y los décimos que le tocaron a cada uno 🤔'); }
}

// ---------- MODO PINTA: pinta enteros divididos y ve fracción = decimal ----------
// Soporta fracciones PROPIAS (3/5) e IMPROPIAS (27/5, 11/2) con varias barras.
let den=5, objetivoN=0, pintado=0, bars=1;
function fmtDec(v){ let s=v.toFixed(2).replace(/0+$/,'').replace(/\.$/,''); return s.replace('.',','); }
function nuevoPinta(){
  den = [2,4,5,10][rnd(4)];                 // denominadores con decimal exacto
  const propia = Math.random()<0.4;
  objetivoN = propia ? (1+rnd(den-1)) : (den+1+rnd(den*5)); // impropia hasta ~6 enteros (ej: 27/5, 11/2)
  bars = Math.max(1, Math.ceil(objetivoN/den));
  pintado=0;
  const comoFrac = Math.random()<0.5;
  $('consigna').innerHTML = comoFrac
    ? `Pinta la fracción <b>${objetivoN}/${den}</b>`
    : `Pinta el decimal <b>${fmtDec(objetivoN/den)}</b>`;
  pintarBarras();
  render();
}
function pintarBarras(){
  const g=$('grid'); g.style.display='flex'; g.style.flexDirection='column'; g.style.gap='8px'; g.style.gridTemplateColumns='';
  g.innerHTML=''; let idx=0;
  for(let b=0;b<bars;b++){
    const bar=document.createElement('div'); bar.style.cssText='display:flex;gap:3px;justify-content:center';
    for(let c=0;c<den;c++){ const gi=idx; const cel=document.createElement('div'); cel.className='cel diez'; cel.style.cssText='flex:1;max-width:56px;aspect-ratio:1'; cel.onclick=()=>pintaHasta(gi); bar.appendChild(cel); idx++; }
    g.appendChild(bar);
  }
}
function pintaHasta(i){ pintado=i+1; render(); beep(480+i*4,.05); }
function limpiar(){ pintado=0; render(); }
function render(){
  const cels=$('grid').querySelectorAll('.cel');
  cels.forEach((c,i)=>c.classList.toggle('on', i<pintado));
  const dec=fmtDec(pintado/den);
  let mixto='';
  if(pintado>den){ const w=Math.floor(pintado/den), r=pintado%den; mixto = ` <span style="font-size:.85rem;color:#cdd7e4;font-weight:700">= ${w} entero${w>1?'s':''}${r?(' y '+r+'/'+den):''}</span>`; }
  $('igual').innerHTML=`<span class="frac"><span>${pintado}</span><span class="b">${den}</span></span> <span>=</span> <span class="dec">${dec}</span>${mixto}`;
}
function comprobar(){
  if(pintado===objetivoN){
    chime(); premio(); score++; $('score').textContent='⭐ '+score;
    const w=Math.floor(objetivoN/den), r=objetivoN%den;
    const mix = objetivoN>den ? ` (${w} entero${w>1?'s':''}${r?(' y '+r+'/'+den):''})` : '';
    $('consigna').innerHTML=`🎉 ¡Correcto! <b>${objetivoN}/${den}</b> = <b style="color:#8fd694">${fmtDec(objetivoN/den)}</b>${mix}. ¡Es la misma cantidad!`;
    setTimeout(nuevo, 2800);
  } else {
    beep(180,.25);
    msj(pintado<objetivoN?'Falta pintar un poco más 💪':'Pintaste de más, borra un poco 🙂');
  }
}

// ---------- MODO EMPAREJAR: fracción ↔ decimal ----------
const BANCO=[[1,2,'0,5'],[1,4,'0,25'],[3,4,'0,75'],[3,10,'0,3'],[7,10,'0,7'],[1,5,'0,2'],[2,5,'0,4'],[9,10,'0,9'],
  [11,2,'5,5'],[5,2,'2,5'],[7,2,'3,5'],[7,4,'1,75'],[5,4,'1,25'],[9,5,'1,8'],[27,5,'5,4'],[12,5,'2,4'],[3,2,'1,5'],[13,10,'1,3']];
let selFrac=null, listos=0, parN=0;
function mezcla(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function nuevoPar(){
  const set=mezcla(BANCO).slice(0,4); parN=set.length; listos=0; selFrac=null;
  const fracs=mezcla(set), decs=mezcla(set);
  $('consigna').innerHTML='Une cada <b>fracción</b> con su <b>decimal</b> 🔗';
  let h='<div style="display:flex;gap:12px"><div style="flex:1">';
  h+=fracs.map(f=>`<div class="ficha" data-k="${f[0]}/${f[1]}" onclick="tocaFrac('${f[0]}/${f[1]}',this)"><span class="frac"><span>${f[0]}</span><span class="b">${f[1]}</span></span></div>`).join('');
  h+='</div><div style="flex:1">';
  h+=decs.map(d=>`<div class="ficha" data-k="${d[0]}/${d[1]}" onclick="tocaDec('${d[0]}/${d[1]}',this)">${d[2]}</div>`).join('');
  h+='</div></div>';
  $('par').innerHTML=h;
}
function tocaFrac(k,el){ if(el.classList.contains('ok'))return; document.querySelectorAll('#par .ficha').forEach(f=>{ if(f.dataset.k && !f.classList.contains('ok')) f.classList.remove('sel'); }); selFrac={k,el}; el.classList.add('sel'); }
function tocaDec(k,el){
  if(el.classList.contains('ok')||!selFrac)return;
  if(k===selFrac.k){ el.classList.add('ok'); selFrac.el.classList.add('ok','sel'); selFrac.el.classList.remove('sel'); el.classList.remove('sel'); selFrac=null; beep(660,.12); setTimeout(()=>beep(880,.14),100);
    listos++; if(listos>=parN){ chime(); premio(); score++; $('score').textContent='⭐ '+score; $('consigna').innerHTML='🎉 ¡Todas unidas! Fracción y decimal son lo mismo.'; setTimeout(nuevo,2400); }
  } else { beep(180,.25); el.classList.add('sel'); setTimeout(()=>el.classList.remove('sel'),350); }
}

function _gate(){ if(window.VFX && VFX.bloquearSi) VFX.bloquearSi('matematicas'); }
document.addEventListener('vfx-listo', _gate); if(window.VFX) _gate();
nuevo();
</script>
</body>
</html>
